[project]
name = "anekanta"
version = "0.1.0"
description = "Collect and locate passages in works citing a publication"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gaurav Sood"}]
requires-python = ">=3.10"
dependencies = ["pdfminer.six==20260107", "ftfy==6.3.1", "jsonschema>=4.18,<5", "referencing>=0.30", "httpx>=0.27,<1"]

[project.scripts]
anekanta = "anekanta.cli:main"

[project.urls]
Repository = "https://github.com/recite/anekanta"
Homepage = "https://recite.github.io/anekanta/"
Documentation = "https://recite.github.io/anekanta/"

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["black", "isort", "flake8", {include-group = "test"}, "ruff>=0.14", "pyright>=1.1.390", "pre-commit>=4"]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]
test = ["pytest>=8", "pytest-cov>=6"]

[tool.ruff]
extend-exclude = ["arxiv", "scripts/scholar.py", "scripts/autosumpdf.py"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF", "S603"]
"docs/**" = ["D"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
allow-init-docstring = true
# The arxiv directory preserves the historical Python 2 KDD workflow.
exclude = '\.venv|tests|docs|arxiv/'

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"

[tool.uv.dependency-groups]
docs = {requires-python = ">=3.13"}

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
minversion = "8"
log_level = "INFO"
xfail_strict = true
